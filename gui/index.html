<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/play_button.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PearAI</title>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- VSCode API 초기화 스크립트 -->
    <script>
      console.log('[VSCode API] Initialization script running...');
      console.log('[VSCode API] Location:', window.location.href);
      console.log('[VSCode API] Protocol:', window.location.protocol);
      console.log('[VSCode API] acquireVsCodeApi available:', typeof acquireVsCodeApi !== 'undefined');
      console.log('[VSCode API] window.acquireVsCodeApi available:', typeof window.acquireVsCodeApi !== 'undefined');
      console.log('[VSCode API] vscode global available:', typeof vscode !== 'undefined');
      console.log('[VSCode API] window.vscode available:', typeof window.vscode !== 'undefined');
      
      // VSCode webview 환경에서 API를 미리 초기화
      function initVSCodeAPI() {
        try {
          // 다양한 방법으로 acquireVsCodeApi 접근 시도
          let acquireFunc = null;
          
          if (typeof acquireVsCodeApi !== 'undefined') {
            acquireFunc = acquireVsCodeApi;
          } else if (typeof window.acquireVsCodeApi !== 'undefined') {
            acquireFunc = window.acquireVsCodeApi;
          } else if (window.parent && typeof window.parent.acquireVsCodeApi !== 'undefined') {
            acquireFunc = window.parent.acquireVsCodeApi;
          }
          
          if (acquireFunc) {
            const api = acquireFunc();
            if (api) {
              window.vscodeApi = api;
              window.ide = 'vscode';
              console.log('[VSCode API] Successfully initialized VSCode API');
              return true;
            } else {
              console.warn('[VSCode API] acquireVsCodeApi returned null');
            }
          } else {
            console.debug('[VSCode API] acquireVsCodeApi not available - not in VSCode webview');
          }
        } catch (error) {
          console.error('[VSCode API] Failed to initialize VSCode API:', error);
        }
        return false;
      }
      
      // 즉시 초기화 시도
      const initialized = initVSCodeAPI();
      
      // 실패한 경우 지연 초기화 시도
      if (!initialized) {
        console.log('[VSCode API] Immediate initialization failed, trying delayed initialization...');
        setTimeout(() => {
          const retryResult = initVSCodeAPI();
          if (!retryResult) {
            console.log('[VSCode API] Delayed initialization also failed');
          }
        }, 100);
      }
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
